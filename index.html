<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Ink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="dark-theme">

    <!-- СТРАНИЦА ВХОДА / РЕГИСТРАЦИИ -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <div class="logo">Ink Chat</div>
            <h2 id="auth-title">Вход</h2>
            <div class="input-group">
                <input type="text" id="auth-username" placeholder="Имя пользователя">
            </div>
            <div class="input-group">
                <input type="password" id="auth-password" placeholder="Пароль">
            </div>
            <div class="input-group hidden" id="reg-id-field">
                <input type="text" id="generated-id" placeholder="Ваш ID" readonly>
            </div>
            <button id="auth-submit-btn" class="btn-main">Войти</button>
            <p class="auth-toggle">Нет аккаунта? <span id="toggle-auth-mode">Зарегистрироваться</span></p>
        </div>
    </div>

    <!-- СТРАНИЦА МЕССЕНДЖЕРА -->
    <div id="app-screen" class="app-container hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="menu-icon" id="profile-menu-btn"><i class="fas fa-bars"></i></div>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Поиск по ID (5 знаков)...">
                    <button id="add-chat-btn" class="hidden"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div class="chats-list" id="chats-list"></div>
        </aside>

        <main class="chat-window">
            <div id="no-chat-selected" class="no-chat"><span>Выберите, кому хотели бы написать</span></div>
            <div id="active-chat-container" class="chat-container hidden">
                <div class="chat-header">
                    <div class="chat-info" id="chat-header-info"></div>
                    <div class="header-actions">
                        <button id="delete-friend-btn" class="btn-icon"><i class="fas fa-user-minus"></i></button>
                        <button id="theme-toggle" class="btn-icon"><i class="fas fa-moon"></i></button>
                    </div>
                </div>
                <div class="messages-display" id="messages-display"></div>
                <div class="chat-input-area">
                    <input type="text" id="message-input" placeholder="Напишите сообщение...">
                    <button id="send-msg-btn" class="btn-send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->
    <div id="modal-profile" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ваш профиль</h3>
                <span class="close-modal" id="close-profile-btn">&times;</span>
            </div>
            <div class="modal-body">
                <p><strong>Ваш ID:</strong> <span id="prof-id"></span></p>
                <p><strong>Дата создания:</strong> <span id="prof-date"></span></p>
                <div class="input-group">
                    <label>Имя:</label>
                    <input type="text" id="prof-name">
                </div>
                <div class="input-group">
                    <label>Новый пароль:</label>
                    <input type="password" id="prof-pass">
                </div>
                <button id="save-profile-btn" class="btn-main">Сохранить</button>
                <hr style="margin: 15px 0; border-color: var(--border-color);">
                <button id="delete-acc-btn" class="btn-danger">Удалить аккаунт навсегда</button>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ ЧАСТЯМИ -->
    <script src="client1.js"></script>
    <script src="client2.js"></script>
    <script src="client3.js"></script>
    <script src="client4.js"></script>
</body>
</html>
