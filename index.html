<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #0e1621; --sidebar: #17212b; --text: #f5f5f5;
            --active: #24303f; --primary: #2b5278; --msg-in: #182533; --msg-out: #2b5278;
        }
        [data-theme="light"] {
            --bg: #e7ebf0; --sidebar: #ffffff; --text: #000000;
            --active: #f4f4f5; --primary: #3390ec; --msg-in: #ffffff; --msg-out: #eeffde;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        #auth-screen, #app-screen { width: 100vw; height: 100vh; display: flex; }
        .hidden { display: none !important; }

        /* Авторизация */
        #auth-screen { flex-direction: column; align-items: center; justify-content: center; background: var(--sidebar); }
        .auth-box { background: var(--bg); padding: 30px; border-radius: 10px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; background: var(--active); color: var(--text); }
        button { background: var(--primary); cursor: pointer; font-weight: bold; }

        /* Главное приложение */
        #sidebar { width: 30%; background: var(--sidebar); border-right: 1px solid rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        #chat-area { width: 70%; display: flex; flex-direction: column; background: var(--bg); }
        
        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            #chat-area { display: none; width: 100%; }
            .mobile-back { display: block !important; }
        }

        .header { padding: 15px; background: var(--sidebar); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .list { flex: 1; overflow-y: auto; }
        .item { padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .item:hover, .item.active { background: var(--active); }
        
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; position: relative; word-break: break-word; }
        .msg.in { background: var(--msg-in); align-self: flex-start; }
        .msg.out { background: var(--msg-out); align-self: flex-end; }
        
        .msg-meta { font-size: 0.75rem; opacity: 0.6; text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; gap: 5px; }
        .input-bar { padding: 15px; background: var(--sidebar); display: flex; gap: 10px; }
        
        .status { font-size: 0.8rem; }
        .online { color: #40a7e3; }
        .offline { color: #8596a5; }
        
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--sidebar); padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 100; }
        .backdrop { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.5); z-index: 99; }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="text-align:center; margin-bottom:15px;">Ink chat</h2>
            <div id="login-form">
                <input type="text" id="auth-id" placeholder="10-значный ID">
                <input type="password" id="auth-pass" placeholder="Пароль">
                <button onclick="auth(false)">Войти</button>
                <p style="text-align:center; margin-top:10px; cursor:pointer; font-size:0.9rem;" onclick="toggleAuthMode(true)">Создать аккаунт</p>
            </div>
            <div id="reg-form" class="hidden">
                <input type="text" id="reg-name" placeholder="Ваше имя">
                <input type="password" id="reg-pass" placeholder="Пароль">
                <button onclick="auth(true)">Зарегистрироваться</button>
                <p style="text-align:center; margin-top:10px; cursor:pointer; font-size:0.9rem;" onclick="toggleAuthMode(false)">Уже есть аккаунт</p>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div id="app-screen" class="hidden">
        <div id="sidebar">
            <div class="header">
                <span id="my-profile" style="font-weight:bold; cursor:pointer;" onclick="openProfile()">Профиль</span>
                <span style="cursor:pointer;" onclick="toggleTheme()">🌙/☀️</span>
            </div>
            <div style="padding:10px; display:flex; gap:5px;">
                <button style="padding:6px; margin:0; font-size:0.8rem;" onclick="openSearch()">+ Друг</button>
                <button style="padding:6px; margin:0; font-size:0.8rem;" onclick="openGroupCreate()">+ Группа</button>
            </div>
            <div class="list" id="chats-list"></div>
        </div>

        <div id="chat-area">
            <div class="header">
                <button class="mobile-back hidden" style="width:auto; margin:0; padding:5px 10px;" onclick="backToSidebar()">Назад</button>
                <div>
                    <h3 id="chat-title">Выберите чат</h3>
                    <span id="chat-status"></span>
                </div>
            </div>
            <div class="messages" id="msg-container"></div>
            <div class="input-bar hidden" id="chat-input-bar">
                <input type="text" id="msg-input" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter')sendMsg()">
                <button style="width:auto; margin:0;" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <div id="backdrop" class="backdrop hidden" onclick="closeModals()"></div>
    <div id="modal" class="modal hidden"></div>
    <script>
        const socket = io();
        let me = null;
        let activeChat = null;
        let friends = JSON.parse(localStorage.getItem('ink_friends') || '[]');

        // Авто-пробуждение (Render)
        setInterval(() => socket.emit('ping'), 25000);

        // Тема оформления
        if(localStorage.getItem('theme') === 'light') document.body.setAttribute('data-theme', 'light');
        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const target = current === 'light' ? 'dark' : 'light';
            if(target === 'light') document.body.setAttribute('data-theme', 'light');
            else document.body.removeAttribute('data-theme');
            localStorage.setItem('theme', target);
        }

        function toggleAuthMode(isReg) {
            document.getElementById('login-form').classList.toggle('hidden', isReg);
            document.getElementById('reg-form').classList.toggle('hidden', !isReg);
        }

        function auth(isRegister) {
            const payload = isRegister ? 
                { name: document.getElementById('reg-name').value, password: document.getElementById('reg-pass').value, isRegister: true } :
                { id: document.getElementById('auth-id').value, password: document.getElementById('auth-pass').value, isRegister: false };
            socket.emit('auth', payload);
        }

        socket.on('auth_success', (user) => {
            me = user;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            updateProfileHeader();
            socket.emit('get_chats');
        });

        socket.on('auth_error', msg => alert(msg));

        function updateProfileHeader() {
            document.getElementById('my-profile').innerHTML = `${me.name} ${me.isAdmin ? '☑️' : ''} <br><small style="opacity:0.6;">ID: ${me.id}</small>`;
        }

        socket.on('chats_list', (chats) => {
            const container = document.getElementById('chats-list');
            container.innerHTML = '';
            
            chats.forEach(chat => {
                if(!chat.isGroup && !friends.includes(chat.id)) return;
                
                const item = document.createElement('div');
                item.className = `item ${activeChat?.id === chat.id ? 'active' : ''}`;
                item.onclick = () => selectChat(chat);
                
                const statusHtml = chat.isGroup ? '' : 
                    `<span class="status ${chat.isOnline ? 'online' : 'offline'}" data-uid="${chat.id}">${chat.isOnline ? '• в сети' : '• офлайн'}</span>`;
                
                item.innerHTML = `<div>${chat.name} ${chat.isAdmin ? '☑️' : ''}</div>${statusHtml}`;
                container.appendChild(item);
            });
        });

        function selectChat(chat) {
            activeChat = chat;
            document.getElementById('chat-title').innerText = chat.name;
            document.getElementById('chat-status').innerText = chat.isGroup ? 'Группа' : '';
            document.getElementById('chat-input-bar').classList.remove('hidden');
            
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('chat-area').style.display = 'flex';
                document.querySelector('.mobile-back').classList.remove('hidden');
            }

            socket.emit('get_messages', { chatId: chat.id, isGroup: chat.isGroup });
            socket.emit('get_chats');
        }

        function backToSidebar() {
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('chat-area').style.display = 'none';
        }

        socket.on('messages_list', (msgs) => {
            const container = document.getElementById('msg-container');
            container.innerHTML = '';
            msgs.forEach(appendMessage);
            container.scrollTop = container.scrollHeight;
        });

        function appendMessage(msg) {
            const container = document.getElementById('msg-container');
            const isMy = msg.senderId === me.id;
            
            const div = document.createElement('div');
            div.className = `msg ${isMy ? 'out' : 'in'}`;
            div.id = msg.id;

            const nameSpan = document.createElement('div');
            nameSpan.style = 'font-size:0.8rem; font-weight:bold; margin-bottom:3px;';
            nameSpan.innerText = `${msg.senderName} ${msg.senderIsAdmin ? '☑️' : ''}`;
            
            const textSpan = document.createElement('span');
            textSpan.className = 'msg-text';
            textSpan.textContent = msg.text; // Защита от XSS

            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            meta.innerHTML = `${msg.edited ? '✏️ ' : ''} ${msg.time} <span class="ticks">${isMy ? (msg.isRead ? '✓✓' : '✓') : ''}</span>`;

            if(!isMy) div.appendChild(nameSpan);
            div.appendChild(textSpan);
            div.appendChild(meta);

            if(isMy) {
                div.style.cursor = 'pointer';
                div.onclick = () => showMsgActions(msg.id, msg.text);
            }

            container.appendChild(div);
        }

        socket.on('new_msg', (msg) => {
            if (activeChat && ((activeChat.isGroup && msg.receiverId === activeChat.id) || 
                (!activeChat.isGroup && (msg.senderId === activeChat.id || msg.receiverId === activeChat.id)))) {
                appendMessage(msg);
                const container = document.getElementById('msg-container');
                container.scrollTop = container.scrollHeight;
                
                if(msg.senderId !== me.id) {
                    socket.emit('get_messages', { chatId: activeChat.id, isGroup: activeChat.isGroup });
                }
            }
        });

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if(!input.value.trim() || !activeChat) return;
            socket.emit('send_msg', { receiverId: activeChat.id, isGroup: activeChat.isGroup, text: input.value });
            input.value = '';
        }

        function showMsgActions(msgId, currentText) {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <button onclick="editMsgPrompt('${msgId}', '${currentText}')">✏️ Редактировать</button>
                <button style="background:#d93838;" onclick="deleteMsg('${msgId}')">❌ Удалить</button>
            `;
            openModal();
        }

        function editMsgPrompt(msgId, oldText) {
            const nText = prompt("Редактировать сообщение:", oldText);
            if(nText && nText.trim()) {
                socket.emit('edit_msg', { msgId, newText: nText });
            }
            closeModals();
        }

        function deleteMsg(msgId) {
            if(confirm("Удалить сообщение для всех?")) {
                socket.emit('delete_msg', { msgId });
            }
            closeModals();
        }

        socket.on('msg_edited', ({ msgId, text }) => {
            const el = document.getElementById(msgId);
            if(el) {
                el.querySelector('.msg-text').textContent = text;
                if(!el.querySelector('.msg-meta').innerHTML.includes('✏️')) {
                    el.querySelector('.msg-meta').innerHTML = '✏️ ' + el.querySelector('.msg-meta').innerHTML;
                }
            }
        });

        socket.on('msg_deleted', ({ msgId }) => {
            document.getElementById(msgId)?.remove();
        });

        socket.on('msg_read', ({ msgId }) => {
            const el = document.getElementById(msgId);
            if(el) el.querySelector('.ticks').innerText = '✓✓';
        });

        socket.on('user_status', ({ id, isOnline }) => {
            document.querySelectorAll(`[data-uid="${id}"]`).forEach(el => {
                el.className = `status ${isOnline ? 'online' : 'offline'}`;
                el.innerText = isOnline ? '• в сети' : '• офлайн';
            });
        });

        socket.on('user_renamed', ({ id, name }) => {
            if(activeChat && activeChat.id === id) {
                document.getElementById('chat-title').innerText = name;
            }
            socket.emit('get_chats');
        });

        function openSearch() {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <h3>Добавить друга по ID</h3>
                <input type="text" id="search-uid" placeholder="10-значный ID">
                <button onclick="searchContact()">Найти</button>
            `;
            openModal();
        }

        function searchContact() {
            const id = document.getElementById('search-uid').value;
            socket.emit('search_contact', id);
        }

        socket.on('contact_found', (user) => {
            if(!friends.includes(user.id)) {
                friends.push(user.id);
                localStorage.setItem('ink_friends', JSON.stringify(friends));
            }
            alert(`Контакт ${user.name} добавлен!`);
            closeModals();
            socket.emit('get_chats');
        });
        socket.on('contact_error', m => alert(m));

        function openGroupCreate() {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <h3>Создать закрытую группу</h3>
                <input type="text" id="g-name" placeholder="Название группы">
                <p style="margin:5px 0;font-size:0.8rem;">Все ваши друзья будут добавлены автоматически</p>
                <button onclick="createGroup()">Создать</button>
            `;
            openModal();
        }

        function createGroup() {
        socket.on('group_created', () => socket.emit('get_chats'));

        function openProfile() {
            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <h3>Редактировать профиль</h3>
                <input type="text" id="p-name" value="${me.name}" placeholder="Имя">
                <input type="password" id="p-pass" value="${me.password}" placeholder="Новый пароль">
                <button onclick="updateProfile()">Сохранить</button>
            `;
            openModal();
        }

        function updateProfile() {
            const name = document.getElementById('p-name').value;
            const password = document.getElementById('p-pass').value;
            socket.emit('update_profile', { name, password });
            closeModals();
        }

        socket.on('profile_updated', (user) => {
            me = user;
            updateProfileHeader();
        });

        function openModal() { 
            document.getElementById('modal').classList.remove('hidden'); 
            document.getElementById('backdrop').classList.remove('hidden'); 
        }
        function closeModals() { 
            document.getElementById('modal').classList.add('hidden'); 
            document.getElementById('backdrop').classList.add('hidden'); 
        }
    </script>
</body>
</html>
