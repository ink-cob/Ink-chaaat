<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приватный Чат Ink</title>
    <script src="https://tailwindcss.com"></script>
    <!-- Подключаем клиент Socket.io из CDN, так как сервера на GitHub Pages нет -->
    <script src="https://socket.io"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Окно авторизации -->
    <div id="auth-screen" class="m-auto bg-white p-6 rounded shadow-md w-80 text-center">
        <h2 class="text-xl font-bold mb-4">Вход / Регистрация</h2>
        <input id="auth-username" type="text" placeholder="Имя пользователя" class="w-full border p-2 mb-2 rounded">
        <input id="auth-password" type="password" placeholder="Пароль" class="w-full border p-2 mb-4 rounded">
        <button onclick="auth('login')" class="w-full bg-blue-500 text-white p-2 rounded mb-2">Войти</button>
        <button onclick="auth('register')" class="w-full bg-green-500 text-white p-2 rounded">Создать аккаунт</button>
    </div>

    <!-- Основной интерфейс чата -->
    <div id="chat-screen" class="hidden flex h-full w-full">
        <div class="w-1/4 bg-gray-800 text-white p-4 flex flex-col justify-between">
            <div>
                <div class="mb-4 border-b border-gray-700 pb-2">
                    <p class="font-bold text-lg" id="my-name"></p>
                    <p class="text-sm text-gray-400">Ваш ID: <span id="my-id" class="font-mono text-yellow-400"></span></p>
                </div>
                
                <div class="mb-4 space-y-2">
                    <input id="new-room-name" type="text" placeholder="Имя группы" class="w-full p-1 text-black text-sm rounded">
                    <button onclick="createRoom()" class="w-full bg-blue-600 text-xs py-1 rounded">Создать Группу</button>
                    
                    <input id="new-dm-id" type="text" placeholder="5-значный ID друга" class="w-full p-1 text-black text-sm rounded">
                    <button onclick="createDM()" class="w-full bg-purple-600 text-xs py-1 rounded">Найти друга (ЛС)</button>
                </div>

                <h3 class="font-semibold mb-2 text-gray-300">Ваши чаты:</h3>
                <div id="rooms-list" class="space-y-1 overflow-y-auto max-h-64"></div>
            </div>
            <button onclick="location.reload()" class="bg-red-600 p-2 rounded text-sm text-center">Выйти</button>
        </div>

        <div class="w-3/4 flex flex-col bg-white">
            <div id="chat-header" class="p-4 bg-gray-200 font-bold border-b">Выберите чат</div>
            <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-2"></div>
            
            <div id="input-area" class="hidden p-4 border-t flex gap-2">
                <input id="message-input" type="text" placeholder="Введите сообщение..." class="flex-1 border p-2 rounded">
                <button onclick="sendMessage()" class="bg-blue-500 text-white px-4 py-2 rounded">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // УКАЖИТЕ ЗДЕСЬ ССЫЛКУ НА ВАШ WEB SERVICE ИЗ RENDER
        const SERVER_URL = 'https://onrender.com'; 

        // Настройка сокетов с указанием адреса сервера Render
        const socket = io(SERVER_URL, { withCredentials: true });
        let me = null;
        let activeRoomId = null;

        async function auth(type) {
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            
            try {
                const res = await fetch(`${SERVER_URL}/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.error) return alert(data.error);
                initChat(data);
            } catch(e) {
                alert("Ошибка подключения к серверу Render. Возможно он 'спит'.");
            }
        }

        function initChat(user) {
            me = user;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('my-name').innerText = me.username;
            document.getElementById('my-id').innerText = me.id;
            socket.emit('auth', me.id);
        }

        function createRoom() {
            const name = document.getElementById('new-room-name').value;
            if (name) socket.emit('create_room', { name, userId: me.id });
        }

        function createDM() {
            const targetId = document.getElementById('new-dm-id').value;
            if (targetId) socket.emit('create_dm', { targetId, userId: me.id });
        }

        function selectRoom(roomId, title) {
            activeRoomId = roomId;
            document.getElementById('chat-header').innerText = title;
            document.getElementById('input-area').classList.remove('hidden');
            socket.emit('join_room', roomId);
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input.value.trim() || !activeRoomId) return;
            socket.emit('send_message', { roomId: activeRoomId, userId: me.id, username: me.username, text: input.value });
            input.value = '';
        }

        function editMessage(msgId, oldText) {
            const newText = prompt("Редактировать сообщение:", oldText);
            if (newText && newText !== oldText) {
                socket.emit('edit_message', { msgId, roomId: activeRoomId, userId: me.id, newText });
            }
        }

        function deleteMessage(msgId) {
            if (confirm("Удалить это сообщение?")) {
                socket.emit('delete_message', { msgId, roomId: activeRoomId, userId: me.id });
            }
        }

        function leaveRoom(event, roomId, title) {
            // Останавливаем всплытие события, чтобы при нажатии на крестик не открывался сам чат
            event.stopPropagation(); 
            
            if (confirm(`Вы уверены, что хотите удалить чат с "${title}"?`)) {
                socket.emit('delete_room', { roomId, userId: me.id });
                
                // Если был открыт удаляемый чат, сбрасываем интерфейс
                if (activeRoomId === roomId) {
                    activeRoomId = null;
                    document.getElementById('chat-header').innerText = 'Выберите чат';
                    document.getElementById('messages-container').innerHTML = '';
                    document.getElementById('input-area').classList.add('hidden');
                }
            }
        }

                socket.on('rooms_list', (rooms) => {
            const list = document.getElementById('rooms-list');
            list.innerHTML = '';
            rooms.forEach(r => {
                const title = r.is_dm ? r.dm_name : `👥 ${r.name}`;
                
                // Кнопка удаления (крестик) отображается для всех чатов
                list.innerHTML += `
                    <div class="flex items-center justify-between p-2 bg-gray-700 hover:bg-gray-600 rounded text-sm group">
                        <div onclick="selectRoom('${r.id}', '${title}')" class="cursor-pointer flex-1 truncate">
                            ${title}
                        </div>
                        <button onclick="leaveRoom(event, '${r.id}', '${title}')" class="text-gray-400 hover:text-red-400 ml-2 font-bold px-1 hidden group-hover:block">
                            &times;
                        </button>
                    </div>
                `;
            });
        });


        socket.on('messages_list', (messages) => {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            messages.forEach(appendMessage);
        });

        socket.on('new_message', (msg) => {
            if (msg.room_id === activeRoomId) appendMessage(msg);
        });

        socket.on('message_edited', ({ id, text }) => {
            const el = document.getElementById(`text-${id}`);
            if (el) el.innerText = text;
        });

        socket.on('message_deleted', (id) => {
            document.getElementById(`msg-${id}`)?.remove();
        });

        socket.on('refresh_rooms', () => socket.emit('refresh_rooms'));
        socket.on('error_msg', alert);

        function appendMessage(msg) {
            const container = document.getElementById('messages-container');
            const isMy = msg.user_id === me.id;
            const actions = isMy ? `
                <span onclick="editMessage('${msg.id}', '${msg.text}')" class="text-xs text-blue-500 cursor-pointer ml-2">ред.</span>
                <span onclick="deleteMessage('${msg.id}')" class="text-xs text-red-500 cursor-pointer ml-1">удал.</span>
            ` : '';

            container.innerHTML += `
                <div id="msg-${msg.id}" class="p-2 rounded bg-gray-50 border max-w-lg ${isMy ? 'ml-auto bg-blue-50' : ''}">
                    <div class="text-xs font-bold text-gray-600">${msg.username} ${actions}</div>
                    <div id="text-${msg.id}" class="text-sm mt-1 text-gray-800">${msg.text}</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
