<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Ink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ОКНО АВТОРИЗАЦИИ -->
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <h2>Chat Ink</h2>
            <div class="tabs">
                <button id="tab-login" class="active" onclick="switchAuthTab('login')">Вход</button>
                <button id="tab-register" onclick="switchAuthTab('register')">Регистрация</button>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <input type="text" id="auth-name" placeholder="Имя пользователя" required>
                <input type="password" id="auth-pass" placeholder="Пароль" required>
                <button type="submit" id="auth-submit-btn">Войти</button>
            </form>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС МЕССЕНДЖЕРА -->
    <div id="app-screen" class="screen hidden">
        
        <!-- Левая панель -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="profile-avatar" onclick="toggleModal('profile-modal')">UI</div>
                <input type="text" id="search-contact" placeholder="Поиск по ID..." onkeypress="searchUser(event)">
                <button class="icon-btn" onclick="openCreateGroup()">➕</button>
            </div>
            <div class="chat-list" id="chat-list-container">
                <!-- Сюда динамически загружаются чаты -->
            </div>
        </aside>

        <!-- Окно чата -->
        <main class="chat-window">
            <div id="chat-empty-state" class="empty-state">
                <p>Выберите чат, чтобы начать общение</p>
            </div>
            
            <div id="chat-active-state" class="chat-active hidden">
                <header class="chat-header">
                    <div class="chat-info">
                        <h3 id="current-chat-title">Название чата</h3>
                        <span id="current-chat-status">участники</span>
                    </div>
                    <button id="group-manage-btn" class="icon-btn hidden" onclick="openGroupManagement()">⚙️</button>
                </header>
                
                <div class="message-history" id="message-container">
                    <!-- Сообщения -->
                </div>
                
                <footer class="chat-footer">
                    <form id="message-form" onsubmit="sendMessage(event)">
                        <input type="hidden" id="edit-message-id" value="">
                        <input type="text" id="message-input" placeholder="Напишите сообщение..." required autocomplete="off">
                        <button type="submit" id="send-btn">Отправить</button>
                    </form>
                </footer>
            </div>
        </main>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ПРОФИЛЬ -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Ваш профиль</h3>
            <div class="profile-info">
                <p><strong>Ваш ID:</strong> <span id="prof-id">00000</span></p>
                <p><strong>Дата регистрации:</strong> <span id="prof-date">-</span></p>
                <label>Изменить имя: <input type="text" id="edit-name"></label>
                <label>Изменить пароль: <input type="password" id="edit-pass"></label>
            </div>
            <div class="theme-toggle">
                <span>Темная тема</span>
                <input type="checkbox" id="theme-checkbox" onchange="toggleTheme()">
            </div>
            <div class="modal-actions">
                <button class="btn-save" onclick="updateProfile()">Сохранить</button>
                <button class="btn-logout" onclick="logout()">Выйти</button>
                <button class="btn-delete-acc" onclick="deleteAccount()">Удалить аккаунт</button>
                <button class="btn-close" onclick="toggleModal('profile-modal')">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: СОЗДАНИЕ ГРУППЫ -->
    <div id="group-create-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Создать группу</h3>
            <input type="text" id="new-group-name" placeholder="Название группы" required>
            <p>Добавьте участников по ID (через запятую):</p>
            <input type="text" id="new-group-members" placeholder="Пример: 12345, 67890">
            <div class="modal-actions">
                <button class="btn-save" onclick="submitCreateGroup()">Создать</button>
                <button class="btn-close" onclick="toggleModal('group-create-modal')">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: УПРАВЛЕНИЕ ГРУППОЙ (ДЛЯ СОЗДАТЕЛЯ) -->
    <div id="group-manage-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Управление чатом</h3>
            <label>Переименовать: <input type="text" id="manage-group-name"></label>
            <button onclick="updateGroupName()">Обновить название</button>
            <hr>
            <label>Добавить участника (ID): <input type="text" id="add-member-id"></label>
            <button onclick="addGroupMember()">Добавить</button>
            <hr>
            <h4>Участники:</h4>
            <div id="group-members-list"></div>
            <div class="modal-actions">
                <button class="btn-close" onclick="toggleModal('group-manage-modal')">Закрыть</button>
            </div>
        </div>
    </div>
    <!-- Загружаем Socket.io из глобальной сети CDN -->
    <script src="https://socket.io"></script>
    <!-- Только после этого подключаем вашу логику -->
    <script src="app.js"></script>
</body>
</html>
