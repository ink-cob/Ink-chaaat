<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://socket.io"></script>
    <style>
        /* Оригинальная палитра Telegram Web Dark */
        :root {
            --bg-color: #0e1621;
            --sidebar-bg: #17212b;
            --surface-hover: #202b36;
            --text-main: #f5f5f5;
            --text-muted: #708499;
            --accent: #5288c1;
            --accent-hover: #6496cb;
            --msg-in: #182533;
            --msg-out: #2b5278;
            --border: #101921;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Компоненты ТГ */
        .tg-sidebar { background-color: var(--sidebar-bg); border-right: 1px solid var(--border); }
        .tg-input { background-color: var(--bg-color); border: 1px solid var(--border); }
        .tg-input:focus { border-color: var(--accent); }
        
        .item-active { background-color: var(--accent) !important; color: #fff !important; }
        .item-active .text-muted { color: #cbd5e1 !important; }
        
        .msg-in-bubble { background-color: var(--msg-in); border-radius: 10px 10px 10px 2px; }
        .msg-out-bubble { background-color: var(--msg-out); border-radius: 10px 10px 2px 10px; }

        /* Навигация слайдов (меню и экраны) */
        .drawer { transform: translateX(-100%); transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .drawer.open { transform: translateX(0); }

        @media (max-width: 768px) {
            .mobile-hidden { display: none !important; }
            .mobile-full { width: 100% !important; position: fixed; inset: 0; z-index: 30; }
        }

        /* Нативный тонкий скроллбар */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative overflow-hidden select-none">
    <!-- ЭКРАН АВТОРИЗАЦИИ (Строгий flat-стиль ТГ Веб) -->
    <div id="auth-screen" class="m-auto w-full max-w-[360px] p-6 z-40">
        <div class="text-center mb-8">
            <svg class="w-24 h-24 mx-auto text-[#5288c1]" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-1-.65-.35-1 .22-1.62.15-.15 2.73-2.5 2.78-2.7.01-.03.01-.15-.06-.21-.07-.06-.17-.04-.25-.02-.11.02-1.83 1.16-5.16 3.41-.49.33-.93.5-1.33.49-.44-.01-1.29-.25-1.92-.45-.77-.25-1.39-.39-1.34-.83.03-.23.35-.46.97-.71 3.82-1.66 6.37-2.75 7.64-3.27 3.63-1.49 4.38-1.75 4.87-1.76.11 0 .35.03.5.15.13.1.17.24.19.34.02.13.03.36.01.52z"/>
            </svg>
            <h2 class="text-2xl font-medium mt-4 tracking-tight">Вход в Ink chat</h2>
            <p class="text-sm text-[#708499] mt-2">Введите имя пользователя для синхронизации</p>
        </div>
        <div class="space-y-3">
            <input id="auth-username" type="text" placeholder="Имя пользователя" class="w-full tg-input p-3 rounded-lg text-sm outline-none transition-all">
            <input id="auth-password" type="password" placeholder="Пароль" class="w-full tg-input p-3 rounded-lg text-sm outline-none transition-all">
            <button onclick="auth('login')" class="w-full bg-[#5288c1] hover:bg-[#6496cb] text-white font-medium p-3 rounded-lg text-sm transition-colors mt-2">ДАЛЕЕ</button>
            <button onclick="auth('register')" class="w-full bg-transparent text-[#5288c1] hover:underline text-sm py-2 block text-center">Создать аккаунт</button>
        </div>
    </div>

    <!-- ВЫДВИЖНОЕ МЕНЮ (Drawer как в Telegram) -->
    <div id="settings-sidebar" class="drawer fixed top-0 left-0 h-full w-72 tg-sidebar z-50 flex flex-col justify-between">
        <div>
            <div class="p-3 bg-[#17212b] border-b border-[#101921] flex items-center gap-4 h-[56px]">
                <button onclick="toggleSettingsMenu()" class="text-[#708499] hover:text-white p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                </button>
                <span class="font-medium text-base">Инфо</span>
            </div>
            <div class="p-4 border-b border-[#101921] flex items-center gap-3">
                <div class="w-12 h-12 bg-[#5288c1] rounded-full flex items-center justify-center text-lg font-bold text-white uppercase shrink-0" id="menu-avatar">-</div>
                <div class="truncate">
                    <h4 class="font-medium text-sm text-white truncate" id="menu-username">User</h4>
                    <p class="text-xs text-[#708499] font-mono mt-0.5">ID: <span id="menu-id" class="text-amber-500 font-bold">00000</span></p>
                </div>
            </div>
            <div class="p-1 space-y-0.5">
                <button onclick="openPrompt('dm')" class="w-full text-left px-4 py-3 text-sm rounded-lg hover:bg-[#202b36] flex items-center gap-3 text-gray-300">
                    <svg class="w-5 h-5 text-[#708499]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    Найти друга по ID
                </button>
                <button onclick="openPrompt('group')" class="w-full text-left px-4 py-3 text-sm rounded-lg hover:bg-[#202b36] flex items-center gap-3 text-gray-300">
                    <svg class="w-5 h-5 text-[#708499]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Создать группу
                </button>
            </div>
        </div>
        <div class="p-3 border-t border-[#101921]">
            <button onclick="location.reload()" class="w-full text-[#708499] hover:text-rose-400 text-xs py-2 text-center transition-colors">Выйти из аккаунта</button>
        </div>
    </div>
    <!-- ОСНОВНОЙ РАБОЧИЙ ИНТЕРФЕЙС -->
    <div id="chat-screen" class="hidden flex h-full w-full overflow-hidden">
        
        <!-- ЛЕВАЯ СТРАНИЦА: Список чатов -->
        <div class="w-80 h-full tg-sidebar flex flex-col shrink-0 mobile-full z-20">
            <!-- Хедер Сайдбара -->
            <div class="p-3 h-[56px] flex items-center gap-3 shrink-0">
                <button onclick="toggleSettingsMenu()" class="text-[#708499] hover:text-white p-1 rounded-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="flex-1 font-medium text-lg tracking-tight text-white">Telegram</div>
            </div>
            
            <!-- Плоские вкладки категорий -->
            <div class="px-2 flex text-xs font-medium text-[#708499] border-b border-[#101921] pb-1 shrink-0">
                <button onclick="filterRooms('all')" id="tab-all" class="flex-1 py-2 border-b-2 border-[#5288c1] text-white text-center">Все</button>
                <button onclick="filterRooms('dm')" id="tab-dm" class="flex-1 py-2 border-b-2 border-transparent text-center">Личные</button>
                <button onclick="filterRooms('group')" id="tab-group" class="flex-1 py-2 border-b-2 border-transparent text-center">Группы</button>
            </div>

            <!-- Список элементов -->
            <div class="flex-1 overflow-y-auto p-1 space-y-0.5" id="rooms-list"></div>
        </div>

        <!-- ПРАВАЯ СТРАНИЦА: Терминал сообщений -->
        <div id="chat-view-screen" class="flex-1 h-full flex flex-col mobile-hidden mobile-full z-30 tg-bg-chat">
            <!-- Хедер чата -->
            <div class="p-3 bg-[#17212b] border-b border-[#101921] h-[56px] flex items-center shrink-0">
                <div class="flex items-center gap-3 truncate w-full">
                    <button onclick="closeChatPage()" class="md:hidden text-[#708499] hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <div id="chat-header" class="font-medium text-sm text-white truncate">Выберите чат...</div>
                </div>
            </div>
            
            <!-- Лента переписки -->
            <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-2 flex flex-col"></div>
            
            <!-- Нижняя панель ввода текста -->
            <div id="input-area" class="hidden p-3 bg-[#17212b] border-t border-[#101921] flex gap-3 items-center shrink-0">
                <input id="message-input" type="text" placeholder="Напишите сообщение..." class="flex-1 bg-[#0e1621] text-white border border-[#101921] focus:border-[#5288c1] p-2.5 px-4 rounded-lg text-sm outline-none transition-colors" onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="text-[#5288c1] hover:text-[#6496cb] text-sm font-medium px-2 py-1 uppercase tracking-wide">Отправить</button>
            </div>
        </div>
    </div>
    <script>
        // Укажите URL вашего инстанса на Render
        const SERVER_URL = 'https://onrender.com'; 

        const socket = io(SERVER_URL, { withCredentials: true });
        let me = null, activeRoomId = null, allRooms = [], currentFilter = 'all';

        function toggleSettingsMenu() { document.getElementById('settings-sidebar').classList.toggle('open'); }
        function closeChatPage() { document.getElementById('chat-view-screen').classList.add('mobile-hidden'); activeRoomId = null; }

        // Нативные системные диалоги вместо колхозных тяжелых окон
        function openPrompt(type) {
            toggleSettingsMenu();
            if (type === 'dm') {
                const id = prompt("Введите 5-значный ID друга:");
                if (id && id.trim()) socket.emit('create_dm', { targetId: id.trim(), userId: me.id });
            } else {
                const name = prompt("Введите название новой группы:");
                if (name && name.trim()) socket.emit('create_room', { name: name.trim(), userId: me.id });
            }
        }

        async function auth(type) {
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            try {
                const res = await fetch(`${SERVER_URL}/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.error) return alert(data.error);
                me = data;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                
                document.getElementById('menu-username').innerText = me.username;
                document.getElementById('menu-id').innerText = me.id;
                document.getElementById('menu-avatar').innerText = me.username.charAt(0);
                socket.emit('auth', me.id);
            } catch(e) { alert("Сервер просыпается. Повторите через 15 секунд."); }
        }

        function selectRoom(roomId, title) {
            activeRoomId = roomId;
            document.getElementById('chat-header').innerText = title;
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('chat-view-screen').classList.remove('mobile-hidden');
            
            document.querySelectorAll('.chat-item').forEach(e => e.classList.remove('item-active'));
            document.getElementById(`room-${roomId}`)?.classList.add('item-active');
            socket.emit('join_room', roomId);
        }

        function sendMessage() {
            const el = document.getElementById('message-input');
            if (!el.value.trim() || !activeRoomId) return;
            socket.emit('send_message', { roomId: activeRoomId, userId: me.id, username: me.username, text: el.value.trim() });
            el.value = '';
        }

        function editMessage(msgId, oldText) {
            const newText = prompt("Изменить сообщение:", oldText);
            if (newText && newText.trim() !== oldText) socket.emit('edit_message', { msgId, roomId: activeRoomId, userId: me.id, newText: newText.trim() });
        }

        function deleteMessage(msgId) {
            if (confirm("Удалить сообщение?")) socket.emit('delete_message', { msgId, roomId: activeRoomId, userId: me.id });
        }

        function leaveRoom(e, roomId, title) {
            e.stopPropagation();
            if (confirm(`Удалить чат "${title}"?`)) {
                socket.emit('delete_room', { roomId, userId: me.id });
                if (activeRoomId === roomId) closeChatPage();
            }
        }

        function filterRooms(filterType) {
            currentFilter = filterType;
            ['all', 'dm', 'group'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if(t === filterType) btn.className = "flex-1 py-2 border-b-2 border-[#5288c1] text-white text-center";
                else btn.className = "flex-1 py-2 border-b-2 border-transparent text-center";
            });
            renderRoomsList();
        }

        function renderRoomsList() {
            const list = document.getElementById('rooms-list');
            list.innerHTML = '';
            const filtered = allRooms.filter(r => {
                if (currentFilter === 'dm') return r.is_dm === 1;
                if (currentFilter === 'group') return r.is_dm === 0;
                return true;
            });

            filtered.forEach(r => {
                const title = r.is_dm ? r.dm_name : r.name;
                const prefix = r.is_dm ? '' : '👥 ';
                const fullTitle = prefix + title;
                const active = r.id === activeRoomId ? 'item-active' : '';
                const char = title.charAt(0);
                const avatarBg = r.is_dm ? 'bg-slate-700 text-slate-200' : 'bg-teal-700 text-teal-100';

                list.innerHTML += `
                    <div id="room-${r.id}" onclick="selectRoom('${r.id}', '${fullTitle}')" class="chat-item flex items-center justify-between p-2.5 rounded-lg text-sm cursor-pointer hover:bg-[#202b36] ${active} group">
                        <div class="flex items-center gap-3 truncate flex-1">
                            <div class="w-10 h-10 rounded-full ${avatarBg} flex items-center justify-center text-sm font-bold uppercase shrink-0">${char}</div>
                            <div class="truncate"><div class="font-medium text-white truncate">${title}</div><div class="text-xs text-[#708499] truncate mt-0.5">${r.is_dm ? 'личный чат' : 'группа'}</div></div>
                        </div>
                        <button onclick="leaveRoom(event, '${r.id}', '${fullTitle}')" class="text-[#708499] hover:text-rose-400 font-bold opacity-0 group-hover:opacity-100 px-2 text-lg">&times;</button>
                    </div>`;
            });
        }

        socket.on('rooms_list', (rooms) => { allRooms = rooms; renderRoomsList(); });
        socket.on('messages_list', (messages) => { document.getElementById('messages-container').innerHTML = ''; messages.forEach(appendMessage); });
        socket.on('new_message', (msg) => { if (msg.room_id === activeRoomId) appendMessage(msg); });
        socket.on('message_edited', ({ id, text }) => { const el = document.getElementById(`text-${id}`); if (el) el.innerText = text; });
        socket.on('message_deleted', (id) => document.getElementById(`msg-${id}`)?.remove());
        socket.on('refresh_rooms', () => socket.emit('refresh_rooms'));
        socket.on('error_msg', alert);

        function appendMessage(msg) {
            const container = document.getElementById('messages-container');
            const isMy = msg.user_id === me.id;
            const actions = isMy ? `
                <span class="opacity-0 group-hover:opacity-100 inline-flex gap-1.5 ml-2 text-[10px] text-sky-400 font-normal">
                    <span onclick="editMessage('${msg.id}', '${msg.text}')" class="hover:underline">изм</span>
                    <span onclick="deleteMessage('${msg.id}')" class="hover:underline text-rose-400">удал</span>
                </span>` : '';

            container.innerHTML += `
                <div id="msg-${msg.id}" class="flex flex-col group max-w-[75%] ${isMy ? 'self-end items-end' : 'self-start items-start'}">
                    <div class="text-[10px] text-[#708499] mb-0.5 flex items-center px-1 font-normal">${msg.username} ${actions}</div>
                    <div class="p-2.5 px-3.5 shadow-sm text-sm ${isMy ? 'msg-out-bubble text-white' : 'msg-in-bubble text-gray-100'}">
                        <div id="text-${msg.id}" class="break-words whitespace-pre-wrap leading-tight">${msg.text}</div>
                    </div>
                </div>`;
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
