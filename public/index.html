<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Ink</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- АВТОРИЗАЦИЯ -->
    <div id="auth-container" class="auth-container">
        <div class="auth-card">
            <h2 id="auth-title">Вход в Chat Ink</h2>
            <form id="auth-form">
                <div class="input-group">
                    <input type="text" id="auth-name" placeholder="Имя пользователя" required>
                </div>
                <div class="input-group" id="id-group">
                    <input type="text" id="auth-id" placeholder="Ваш 5-значный ID" maxlength="5">
                </div>
                <div class="input-group">
                    <input type="password" id="auth-password" placeholder="Пароль" required>
                </div>
                <button type="submit" id="auth-submit-btn">Войти</button>
            </form>
            <p id="auth-toggle-text">Нет аккаунта? <span id="auth-toggle-link">Зарегистрироваться</span></p>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="app-container" class="app-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-avatar" id="my-profile-btn">👤</div>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Поиск по ID...">
                    <button id="search-btn">🔍</button>
                </div>
                <button id="create-group-btn" title="Создать группу">👥</button>
            </div>
            <div class="chats-list" id="chats-list"></div>
        </aside>

        <main class="chat-area">
            <div class="chat-blank" id="chat-blank">
                <p>Выберите, кому хотите написать</p>
            </div>
            
            <div class="chat-active" id="chat-active" style="display: none;">
                <div class="chat-header">
                    <div class="chat-info">
                        <h3 id="current-chat-title">Название чата</h3>
                        <span id="current-chat-status">участники</span>
                    </div>
                    <div class="chat-actions">
                        <button id="theme-toggle" title="Сменить тему">🌙</button>
                        <button id="chat-settings-btn" title="Управление" style="display: none;">⚙️</button>
                    </div>
                </div>
                <div class="messages-container" id="messages-container"></div>
                <div class="input-area">
                    <input type="text" id="message-input" placeholder="Напишите сообщение...">
                    <button id="send-message-btn">➡️</button>
                </div>
            </div>
        </main>
    </div>
    <!-- ПРОФИЛЬ -->
    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-profile">&times;</span>
            <h2>Мой профиль</h2>
            <div class="profile-details">
                <p><strong>Имя:</strong> <input type="text" id="profile-name-input"></p>
                <p><strong>ID:</strong> <span id="profile-id"></span></p>
                <p><strong>Пароль:</strong> <input type="password" id="profile-pass-input"></p>
                <p><strong>Создан:</strong> <span id="profile-date"></span></p>
            </div>
            <div class="modal-buttons">
                <button id="save-profile-btn" class="btn-primary">Сохранить</button>
                <button id="delete-acc-btn" class="btn-danger">Удалить аккаунт</button>
            </div>
        </div>
    </div>

    <!-- СОЗДАНИЕ ГРУППЫ -->
    <div id="group-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-group">&times;</span>
            <h2>Создать группу</h2>
            <input type="text" id="group-name-input" placeholder="Название группы" required>
            <p>Введите ID через запятую:</p>
            <input type="text" id="group-members-input" placeholder="12345, 54321">
            <button id="submit-group-btn" class="btn-primary">Создать</button>
        </div>
    </div>

    <!-- УПРАВЛЕНИЕ ЧАТОМ -->
    <div id="chat-mgmt-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-mgmt">&times;</span>
            <h2>Управление чатом</h2>
            <input type="text" id="edit-chat-title" placeholder="Новое название">
            <button id="rename-chat-btn" class="btn-primary">Переименовать</button>
            <hr>
            <h3>Участники</h3>
            <div id="mgmt-members-list"></div>
            <div class="add-member-section">
                <input type="text" id="add-member-id" placeholder="ID участника">
                <button id="add-member-btn" class="btn-success">Добавить</button>
            </div>
            <hr>
            <button id="delete-chat-btn" class="btn-danger">Удалить чат</button>
        </div>
    </div>

    <script src="server.js"></script>
</body>
</html>
